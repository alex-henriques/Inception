# Each service = 1 container. The service name becomes the DNS hostname that other containers use to find it on the Docker network
services:
  mariadb:
    build:
      context: requirements/mariadb #where Docker looks for the Dockerfile
      dockerfile: Dockerfile #which Dockerfile to use.
    image: mariadb #the image must be the service name
    restart: unless-stopped # restarts automatically if the container crashes, but not if manually stop it with docker compose down
    environment: # environment variables from .env
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
    secrets: # the file content comes from secrets
      - db_pass
      - db_root_pass
    volumes: 
      - db_data:/var/lib/mysql
    networks: # all 3 containers must be on the same network
      - inception_network
  
  wordpress:
    build:
      context: requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress
    restart: unless-stopped
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER: ${WP_USER}
      WP_USER_EMAIL: ${WP_USER_EMAIL}
    secrets:
      - db_pass
      - db_root_pass
    depends_on: #tells compose to start mariadb before wordpress. this only controls start order
      - mariadb
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception_network
  
  nginx:
    build:
      context: requirements/nginx
      dockerfile: Dockerfile
    image: nginx
    retstart: unless-stopped
    ports: # the only port exposed to the outside world
      - "443:443" # map port on the HOST to port 443 in the container
    depends_on: wordpress
    volumes: # shared volume with WP
      - wp_data:/var/www/html
    networks:
      - inception_network\

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/alehenri/data/mysql
  
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind # 'o' stands for options, it's a mount option passed to the Linux kernel when Docker creates the bind mount
      device: /home/alehenri/data/wordpress

networks:
  inception_netwok:
  driver: bridge

secrets:
  db_pass:
    file: ../secrets/db_pass.txt
  db_root_pass:
    file: ../secrets/db_root_pass.txt
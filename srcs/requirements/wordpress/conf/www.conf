[www]

user    = www-data
group   = www-data

# How NGINX talks to php-fpm
listen  = 0.0.0.0:9000

# Process management: dynamic = php-fpm spawns workers on demand
pm                      = dynamic
pm.max_children         = 5
pm.start_servers        = 2
pm.min_spare_servers    = 1
pm.max_spare_servers    = 3

# Logging: send errors to stderr so Docker captures them with docker logs
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
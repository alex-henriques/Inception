# worker_processes: nr of nginx worker processes; auto = nginx will spawn 1 worker per CPU core. for a single core VM that means 1.
worker_processes    auto;

# events block: worker_connections = how many simult. connections one worker can handle. 1024 is the standard default. total max connections = worker_processes * worker_connections
events
{
	worker_connections  1024;
}


# mime types: tells nginx what content type header to send for each file extension. without it browsers refuse to execute or render JS or CSS
# default_types: fallback for unknown extensions
# sendfile: uses kernel sendfile() syscall to transfer files directly from disk to network socket without copying through userspace. Faster for serving static files

https
{
	include	/etc/nginx/mime.types;
	default_type	app/octect-stream;
	sendfile	on;

	# Listening on 443 with SSL. SSL tells nginx this is a HTTPS server
	# server_name: must match the domain; nginx uses it to route requests when multiple server blocks exist.
	# TLS cert & key: self signed cert generated in the Dockerfile; ssl_certificate=public cert sent to browser; ssl_certificate_key=private key (never leaves container)
	# TLSv1.2 or TLSv1.3
	# root = where WP files live (shared vol.); index= which file to serve when a directory is requested;
	# nginx uses location blocks to decide how to handle diff. URLs
	server
	{
		listen	443 ssl;
		listen	[::]:443 ssl;
		server_name	alehenri.42.fr;
		ssl_certificate	/etc/ssl/certs/nginx.crt;
		ssl_certificate_key	/etc/ssl/private/nginx.key;
		ssl_protocols	TLSv1.2 TLSv1.3;
		root	/var/www/htlm;
		index	index.php index.html;
		# main location: try to serve the file directly, fall to index.php; required by WP permalinks(pretty URLs) to work. 
		# $uri->exact requested path; $uri/ = treat it as a directory
		# /index.php?$args = fall back to WP router with query string
		location /
		{
			try_files	$uri $uri/ /index.php?$args;
		}
		# FastCGI: any requests ending in .php get forwarded to php-fpm;
		location ~ \.php$ 
		{
			try_files	$uri =404;
			fastcgi_pass	wordpress:9000; # points to the WP container by service name on port 9000;
			fastcgi_index	index.php;
			include			fastcgi_params; # standard set of CGI variables;
			fastcgi_param	SCRIPT_FILENAME $document_root$fastcgi_script_name; # full path to the PHP file to execute;
			fastcgi_param	PATH_INFO $fastcgi_path_info; # extra path info after the .php filename
		}
		# static file caching
		location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2)$
		{
			exprites	30d; # tell browser to cache static assets for 30days
			log_not_found	off; # don't pollute logs with missing favicon.ico errors;
		}
	}
}